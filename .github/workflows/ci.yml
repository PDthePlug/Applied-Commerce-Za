name: Applied Commerce CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Curriculum tests
        run: npm test

      - name: Zimbabwe Form 2 residue audit
        run: node scripts/audit_zimbabwe_form2.mjs

      - name: Zimbabwe Form 2 money-cycle detail
        run: node scripts/audit_zimbabwe_form2_money_cycle.mjs

      - name: Zimbabwe Form 2 runtime localisation audit
        run: node scripts/audit_zimbabwe_form2_runtime.mjs

      - name: Zimbabwe Form 2 Term 1 enterprise detail
        run: START_LESSON=1 END_LESSON=16 node scripts/audit_zimbabwe_form2_range.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
